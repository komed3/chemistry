<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting …</title>
    <script>
      ( function () {
        var { origin, hostname, pathname, search, hash } = window.location;

        sessionStorage.setItem( 'ghp_redirect', pathname + search + hash );

        var segments = pathname.split( '/' ).filter( Boolean );
        var base = segments.length > 0 && hostname.endsWith( 'github.io' ) ? '/' + segments[ 0 ] + '/' : '/';

        window.location.replace( origin + base );
      } )();
    </script>
  </head>
  <body></body>
</html>
